name: Preflight (scheduled)

# Catch CVEs disclosed *after* a dependency was merged: re-scan every committed manifest
# weekly and open/update a tracking issue with anything newly vulnerable.
on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  scan:
    name: Scan committed manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions pinned to full commit SHAs (a tag is mutable) — Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./packages/action
        with:
          mode: repo
          # examples/ and test fixtures are INTENTIONALLY vulnerable (demo + regression data) —
          # excluding them keeps the tracking issue signal-only. Exclusions are listed in the issue.
          ignore-paths: 'examples/**,**/tests/fixtures/**'
          # In repo mode the policy contributes only `allow.advisories` — adjudicated advisory ids
          # are listed in the issue but don't keep it red. (No `allow.advisories` entries yet.)
          policy-file: preflight.config.json
          # Report every finding to the issue + Security tab, but only turn this weekly run RED on
          # an actively-exploited CVE. An advisory wave in already-merged deps (Aug 2026: 8 packages
          # / 21 alerts, 0 KEV) would otherwise keep the cron permanently red until upstream ships
          # fixes — the "trains you to ignore it" antipattern. The PR gate stays strict on anything
          # NEW; this only tunes the scheduled alarm. Dogfoods the repo-mode fail-level from #61.
          fail-level: kev
      - name: Upload findings to the Security tab
        if: always() && hashFiles('preflight.sarif') != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: preflight.sarif
