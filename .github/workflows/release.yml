name: Release

# Publish the standalone CLI to npm on a cli-v* tag (e.g. cli-v0.1.0). Requires an NPM_TOKEN
# secret, and the npm account must own the @preflight scope (or rename the package first).
# Plain v* tags (v1, v1.0.0) are reserved for the GitHub ACTION's release pointer — they must
# NOT trigger an npm publish, hence the distinct prefix.
on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish @preflight/cli
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to full commit SHAs (a tag is mutable) — Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache on the PUBLISHING job. A cache entry is writable by any run on
          # any branch, so restoring one here lets a poisoned entry reach the tarball that goes
          # to npm. This runs on a tag a handful of times a month; a cold install is cheap
          # insurance against publishing something a PR run put in the cache.
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      - run: npm publish -w @preflight/cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
